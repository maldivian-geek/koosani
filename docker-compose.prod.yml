# Production stack — for Coolify (or any Docker-Compose-based host), not
# local dev (use docker-compose.yml for that). Builds real production images
# (compiled JS via api/Dockerfile.prod, a static nginx-served bundle via
# web/Dockerfile.prod) instead of the dev-mode tsx-watch/vite-dev-server
# containers.
#
# Postgres is NOT a service in this file — it's a separate Coolify-managed
# standalone database resource (its own "Database" resource, not part of this
# docker-compose application), reachable over Coolify's shared external
# `coolify` Docker network by its resource UUID (see DB_HOST below). Modeled
# on the same pattern already used by another Maldivian Geek project
# (roanuedhuru_v3) on this same Coolify instance. This trades the simplicity
# of one self-contained compose stack for: a Coolify-managed backup/restore
# UI for the database, and the ability to view its logs/terminal directly
# without picking through a multi-container compose app's service selector.
#
# All domain-dependent and secret values are ${VAR} placeholders — set them
# as environment variables on the Coolify resource (or in a .env file next
# to this compose file if deploying by hand). Required:
#   DB_HOST              - the separate Postgres Coolify resource's UUID
#                          (its hostname on the shared `coolify` network)
#   DB_PASSWORD          - that resource's postgres user password
#   JWT_SECRET           - >= 32 chars, e.g. `openssl rand -base64 32`
#   FRONTEND_URL         - the public URL the web app will be served from
#                          (also used as the CORS allowlist entry)
#   VITE_API_URL         - the public URL the api will be served from (baked
#                          into the web bundle at build time — see
#                          web/Dockerfile.prod's comment on why this can't
#                          just be a runtime env var)
#   ADMIN_BUSINESS_NAME, ADMIN_EMAIL, ADMIN_NAME
#                        - first-run admin bootstrap (api/src/db/seedProd.ts).
#                          Runs once per deploy via the dedicated `migrate`
#                          service below (not on every `api`/`worker` start
#                          the way api/docker-entrypoint.sh's default flow
#                          does for local dev's docker-compose.yml), but is
#                          idempotent — a no-op once any business row exists.
#                          Optional:
#                          ADMIN_PASSWORD (a secure one is generated and
#                          printed once to the api container's logs if unset
#                          — check `docker logs` right after first deploy),
#                          ADMIN_TIN, ADMIN_ADDRESS, ADMIN_PHONE.
# FILES_STORAGE defaults to `s3` here (production default) — set S3_BUCKET,
# AWS_REGION, AWS_ENDPOINT_URL (if not AWS itself), AWS_ACCESS_KEY_ID,
# AWS_SECRET_ACCESS_KEY (read directly by the AWS SDK, not by this app's own
# config) for file uploads/PDF downloads to actually work. Until then, set
# FILES_STORAGE=local as a stopgap — api/src/lib/storage.ts's local backend
# is explicitly dev/test-only (its "signed URLs" are fake `local://` strings,
# not real download links), so uploads/downloads silently won't work, but
# everything else in the app runs fine.
# Optional: PORTAL_JWT_SECRET/PORTAL_FRONTEND_URL (customer portal), RESEND_API_KEY
# (email), GEO_PROVIDER.
#
# Every service has a `deploy.resources.limits.memory` cap. This host runs
# other people's apps too, not just this one — a runtime memory leak here
# should OOM this container alone, not destabilize the whole box. (The build
# stage has its own separate caps — see api/Dockerfile.prod and
# web/Dockerfile.prod's NODE_OPTIONS/--network-concurrency comments — after a
# build here took the entire server down once.) Adjust the numbers below to
# whatever headroom the actual server has.

services:
  # One-shot: runs migrations then the idempotent production seed against the
  # separate Postgres resource, then exits. `api`/`worker` wait for this to
  # exit 0 (depends_on below) before starting, instead of each running
  # migrate+seed themselves on every start (api/docker-entrypoint.sh's
  # default flow, still used as-is by local dev's docker-compose.yml, which
  # keeps postgres embedded and doesn't need this separate step). Modeled on
  # roanuedhuru_v3's docker-compose.coolify.yml `migrate` service.
  migrate:
    build:
      context: .
      dockerfile: api/Dockerfile.prod
    restart: 'no'
    command: ['sh', '-c', 'pnpm exec drizzle-kit migrate && node dist/db/seedProd.js']
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://koosani:${DB_PASSWORD}@${DB_HOST}:5432/koosani?sslmode=require
      ADMIN_BUSINESS_NAME: ${ADMIN_BUSINESS_NAME:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_NAME: ${ADMIN_NAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_TIN: ${ADMIN_TIN:-}
      ADMIN_ADDRESS: ${ADMIN_ADDRESS:-}
      ADMIN_PHONE: ${ADMIN_PHONE:-}
    networks:
      - coolify
    deploy:
      resources:
        limits:
          memory: 512M

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M

  clamav:
    image: clamav/clamav:1.5.3
    volumes:
      - clamav_data:/var/lib/clamav
    healthcheck:
      test: ['CMD', 'clamdcheck.sh']
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1500M

  api:
    build:
      context: .
      dockerfile: api/Dockerfile.prod
    # Bypasses api/docker-entrypoint.sh's default migrate+seed+serve flow
    # (still used by local dev's docker-compose.yml) — migration/seed now
    # happens once in the `migrate` service above, not on every api start.
    command: ['node', 'dist/server.js']
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://koosani:${DB_PASSWORD}@${DB_HOST}:5432/koosani?sslmode=require
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      FRONTEND_URL: ${FRONTEND_URL}
      PORTAL_JWT_SECRET: ${PORTAL_JWT_SECRET:-}
      PORTAL_FRONTEND_URL: ${PORTAL_FRONTEND_URL:-}
      CLAMAV_HOST: clamav
      CLAMAV_PORT: '3310'
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM: ${RESEND_FROM:-noreply@example.com}
      GEO_PROVIDER: ${GEO_PROVIDER:-disabled}
      FILES_STORAGE: ${FILES_STORAGE:-s3}
      S3_BUCKET: ${S3_BUCKET}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ENDPOINT_URL: ${AWS_ENDPOINT_URL:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      STORAGE_HOSTNAME: ${STORAGE_HOSTNAME:-}
      ADMIN_BUSINESS_NAME: ${ADMIN_BUSINESS_NAME:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_NAME: ${ADMIN_NAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_TIN: ${ADMIN_TIN:-}
      ADMIN_ADDRESS: ${ADMIN_ADDRESS:-}
      ADMIN_PHONE: ${ADMIN_PHONE:-}
    # No public domain/Traefik routing for api at all — see web/nginx.conf's
    # /api/ location block. web/nginx reverse-proxies /api/* to this service
    # internally on the compose network instead, which sidesteps a real
    # Traefik router-priority problem: Coolify auto-generates a
    # Host && PathPrefix(/api) router for api and Host && PathPrefix(/) for
    # web with no explicit priority, and web's catch-all won in practice even
    # after forcing api's priority explicitly (SECURITY.md §13.12).
    expose:
      - '3000'
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - default
      - coolify
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  worker:
    build:
      context: .
      dockerfile: api/Dockerfile.prod
    command: ['node', 'dist/worker.js']
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://koosani:${DB_PASSWORD}@${DB_HOST}:5432/koosani?sslmode=require
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      FRONTEND_URL: ${FRONTEND_URL}
      PORTAL_JWT_SECRET: ${PORTAL_JWT_SECRET:-}
      PORTAL_FRONTEND_URL: ${PORTAL_FRONTEND_URL:-}
      CLAMAV_HOST: clamav
      CLAMAV_PORT: '3310'
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM: ${RESEND_FROM:-noreply@example.com}
      GEO_PROVIDER: ${GEO_PROVIDER:-disabled}
      FILES_STORAGE: ${FILES_STORAGE:-s3}
      S3_BUCKET: ${S3_BUCKET}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ENDPOINT_URL: ${AWS_ENDPOINT_URL:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      STORAGE_HOSTNAME: ${STORAGE_HOSTNAME:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - default
      - coolify
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  web:
    build:
      context: .
      dockerfile: web/Dockerfile.prod
      args:
        VITE_API_URL: ${VITE_API_URL}
    expose:
      - '80'
    depends_on:
      - api
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M

volumes:
  redis_data:
  clamav_data:

networks:
  # Coolify's own shared network — external because Coolify creates it, not
  # this compose file. `migrate`/`api`/`worker` join it to reach the separate
  # Postgres database resource (by its resource UUID as hostname); `redis`,
  # `clamav`, and `web` don't need it, so they stay on the implicit default
  # network only.
  coolify:
    external: true
