services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: koosani
      POSTGRES_PASSWORD: koosani
      POSTGRES_DB: koosani_dev
    ports:
      - '5434:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U koosani']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - '6380:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # File upload virus scanning (SECURITY.md §13.5, STACK.md "open decision" #2).
  # Set CLAMAV_HOST=localhost CLAMAV_PORT=3311 in api/.env to use it locally.
  # Freshclam takes a few minutes to pull virus definitions on first start.
  clamav:
    image: clamav/clamav:1.5.3
    ports:
      - '3311:3310'
    volumes:
      - clamav_data:/var/lib/clamav
    healthcheck:
      test: ['CMD', 'clamdcheck.sh']
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s

  # App containers (dev mode — same `tsx watch` / `vite` dev servers as
  # `pnpm run dev` on the host, just containerized). Host port 3001/5180 to
  # avoid clashing with the host-run dev servers on 3000/5173-5174 — note
  # 5175 was tried first but collides with an unrelated process already
  # bound there via IPv6 loopback on this machine. Secrets (JWT_SECRET,
  # RESEND_API_KEY, etc.) come from the gitignored api/.env — never
  # hardcoded here; only non-secret container-network wiring is inline.
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    env_file:
      - ./api/.env
    environment:
      DATABASE_URL: postgresql://koosani:koosani@postgres:5432/koosani_dev
      REDIS_URL: redis://redis:6379
      FRONTEND_URL: http://localhost:5180
      CLAMAV_HOST: clamav
      CLAMAV_PORT: '3310'
    ports:
      - '3001:3000'
    volumes:
      - ./api/src:/repo/api/src
      - ./shared/src:/repo/shared/src
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: api/Dockerfile
    command: ['pnpm', 'exec', 'tsx', 'watch', 'src/worker.ts']
    env_file:
      - ./api/.env
    environment:
      DATABASE_URL: postgresql://koosani:koosani@postgres:5432/koosani_dev
      REDIS_URL: redis://redis:6379
      FRONTEND_URL: http://localhost:5180
      CLAMAV_HOST: clamav
      CLAMAV_PORT: '3310'
    volumes:
      - ./api/src:/repo/api/src
      - ./shared/src:/repo/shared/src
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    environment:
      VITE_API_URL: http://localhost:3001
    ports:
      - '5180:5173'
    volumes:
      - ./web/src:/repo/web/src
      - ./shared/src:/repo/shared/src
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
  clamav_data:
