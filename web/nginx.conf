# Static SPA hosting for the production web image (web/Dockerfile.prod).
# Client-side routing fallback: any path not matching a real file falls
# through to index.html so Vue Router's history mode works on a hard refresh
# or direct link (e.g. /invoices/abc123).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS — resolving via a variable (below) instead of a
    # literal proxy_pass target defers hostname resolution to request time
    # instead of nginx config-load time. Without this, nginx fails to start
    # entirely if the `api` container isn't yet network-attached the instant
    # this container boots (a real race with `depends_on`, which only
    # guarantees container *start* order, not readiness).
    resolver 127.0.0.11 valid=10s;

    # Reverse-proxy /api/* to the api service, internally, on the compose
    # network — lets the browser call the api under the web app's own domain
    # (VITE_API_URL=https://<domain>/api, see web/Dockerfile.prod's comment
    # on why that must be a build arg) without a second public subdomain, and
    # without relying on the reverse-proxy/Traefik layer in front of this
    # container to route paths correctly (STACK.md "Migrations + admin
    # bootstrap" section's neighboring note, SECURITY.md §13.12 — a prior
    # attempt to do this purely via Traefik router priority labels didn't
    # reliably win over the web catch-all router).
    # The api's own routes are mounted at root (`/customers`, not
    # `/api/customers`), so the `/api/` prefix must be stripped before
    # forwarding. With a *literal* proxy_pass target ending in `/`, nginx
    # does this automatically — but that requires resolving the upstream
    # hostname at config-load time (the config-load-time-failure problem
    # the resolver above exists to avoid). With a *variable* proxy_pass
    # target (needed for lazy/request-time resolution), nginx does NOT
    # auto-strip the prefix — it silently forwards `/` for every request
    # instead, discarding the actual path entirely. The explicit rewrite
    # does the stripping ourselves so both behaviors are correct together.
    location /api/ {
        # Order matters: `break` halts all further rewrite-module directive
        # processing in this block, including a `set` that comes after it —
        # so `set` must run first, or $api_upstream is left uninitialized.
        set $api_upstream http://api:3000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Forward whatever Traefik already set for these — don't recompute
        # from nginx's own view, which would just see Traefik's container IP.
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|webp|woff2?|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
