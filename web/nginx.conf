# Static SPA hosting for the production web image (web/Dockerfile.prod).
# Client-side routing fallback: any path not matching a real file falls
# through to index.html so Vue Router's history mode works on a hard refresh
# or direct link (e.g. /invoices/abc123).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|webp|woff2?|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
